<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BatchLab — Cálculo de pre-batching</title>
<link rel="icon" href="data:,">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #14110F;
    --bg-elevated: #1B1713;
    --surface: #221D18;
    --surface-hover: #2A241D;
    --border: #38312A;
    --border-soft: #2C2620;
    --brass: #C68B4A;
    --brass-bright: #E0A868;
    --cream: #F2E9DC;
    --muted: #A0947F;
    --muted-dim: #746A5B;
    --sage: #7A9A87;
    --rust: #C1573D;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    font-family: 'Inter', -apple-system, sans-serif;
  }
  #root { min-height: 100vh; display: flex; }

  .bl-root {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--cream);
    min-height: 100vh;
    width: 100%;
    display: flex;
    flex-direction: column;
  }

  .bl-print-header { display: none; }

  .bl-spin { animation: bl-spin 0.9s linear infinite; }
  @keyframes bl-spin { to { transform: rotate(360deg); } }
  .bl-spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--brass-bright);
    border-radius: 50%;
  }

  /* header */
  .bl-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border-soft);
  }
  .bl-brand { display: flex; align-items: center; gap: 8px; color: var(--brass-bright); }
  .bl-brand-name {
    font-family: 'Fraunces', serif;
    font-size: 19px;
    letter-spacing: 0.01em;
    color: var(--cream);
  }
  .bl-brand-name em { color: var(--brass-bright); font-style: italic; }
  .bl-header-right { display: flex; align-items: center; gap: 12px; }

  .bl-save { font-size: 12px; display: flex; align-items: center; gap: 5px; min-width: 14px; color: var(--muted-dim); }
  .bl-save-saving { color: var(--muted); }
  .bl-save-saved { color: var(--sage); }

  .bl-mobile-toggle {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 7px 12px;
    border-radius: 7px;
    cursor: pointer;
  }

  /* body layout */
  .bl-body { display: flex; flex: 1; }

  .bl-sidebar {
    width: 272px;
    flex-shrink: 0;
    background: var(--bg-elevated);
    border-right: 1px solid var(--border-soft);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .bl-new-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    background: var(--brass);
    color: #1B140B;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .bl-new-btn:hover { background: var(--brass-bright); }
  .bl-new-btn:focus-visible { outline: 2px solid var(--brass-bright); outline-offset: 2px; }

  .bl-side-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
  .bl-side-empty { color: var(--muted-dim); font-size: 13px; line-height: 1.5; padding: 8px 2px; }

  .bl-side-item {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 9px;
    padding: 11px 12px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .bl-side-item:hover { background: var(--surface-hover); }
  .bl-side-item-active { border-color: var(--brass); background: var(--surface-hover); }

  .bl-side-item-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .bl-side-item-name {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    color: var(--cream);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bl-side-item-actions { display: flex; gap: 2px; flex-shrink: 0; }
  .bl-side-item-meta { font-size: 11.5px; color: var(--muted-dim); margin-top: 3px; font-family: 'IBM Plex Mono', monospace; }

  .bl-mini-bar { display: flex; height: 4px; border-radius: 3px; overflow: hidden; margin-top: 9px; background: var(--border); }
  .bl-mini-bar span { height: 100%; }

  .bl-icon-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 4px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .bl-icon-btn-ghost:hover { color: var(--rust); background: rgba(193, 87, 61, 0.12); }

  /* main */
  .bl-main { flex: 1; padding: 26px 30px 40px; overflow-y: auto; }

  .bl-empty {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    max-width: 420px;
    margin-top: 40px;
    color: var(--muted);
  }
  .bl-empty h2 { font-family: 'Fraunces', serif; font-size: 22px; color: var(--cream); margin: 4px 0 0; font-weight: 500; }
  .bl-empty p { font-size: 14px; line-height: 1.6; margin: 0 0 8px; }

  .bl-panel-head { margin-bottom: 20px; }
  .bl-panel-head-row { display: flex; align-items: center; gap: 16px; justify-content: space-between; flex-wrap: wrap; }

  .bl-name-input {
    background: transparent;
    border: none;
    font-family: 'Fraunces', serif;
    font-size: 30px;
    color: var(--cream);
    flex: 1;
    min-width: 220px;
    padding: 2px 0;
    border-bottom: 1px solid transparent;
  }
  .bl-name-input:hover { border-bottom-color: var(--border); }
  .bl-name-input:focus { outline: none; border-bottom-color: var(--brass); }

  .bl-panel-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .bl-ghost-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .bl-ghost-btn:hover { color: var(--brass-bright); border-color: var(--brass); }

  .bl-target-row { display: flex; align-items: flex-end; gap: 22px; margin-top: 18px; flex-wrap: wrap; }

  .bl-field { display: flex; flex-direction: column; gap: 6px; }
  .bl-field-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted-dim); }

  .bl-liter-input-wrap {
    display: flex;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    width: fit-content;
  }
  .bl-liter-input {
    background: transparent;
    border: none;
    color: var(--cream);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 17px;
    padding: 8px 4px 8px 12px;
    width: 84px;
  }
  .bl-liter-input:focus { outline: none; }
  .bl-liter-unit { color: var(--muted); font-size: 13px; padding-right: 12px; font-family: 'IBM Plex Mono', monospace; }

  .bl-presets { display: flex; gap: 6px; flex-wrap: wrap; padding-bottom: 2px; }
  .bl-preset {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    padding: 7px 11px;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .bl-preset:hover { color: var(--cream); border-color: var(--muted-dim); }
  .bl-preset-active { background: rgba(198, 139, 74, 0.16); border-color: var(--brass); color: var(--brass-bright); }

  /* ratio bar */
  .bl-ratio-section { margin: 22px 0 26px; }
  .bl-ratio-bar {
    display: flex;
    height: 34px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border-soft);
  }
  .bl-ratio-seg { transition: opacity 0.15s ease; cursor: default; }
  .bl-ratio-seg:hover { opacity: 0.82; }
  .bl-ratio-caption { font-size: 11.5px; color: var(--muted-dim); margin-top: 8px; font-family: 'IBM Plex Mono', monospace; }

  /* table */
  .bl-table-wrap { overflow-x: auto; border: 1px solid var(--border-soft); border-radius: 10px; }
  .bl-table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 880px; }

  .bl-table thead th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted-dim);
    font-weight: 500;
    padding: 12px 14px;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border-soft);
    white-space: nowrap;
  }
  .bl-th-name { min-width: 190px; }

  .bl-table tbody tr { border-bottom: 1px solid var(--border-soft); }
  .bl-table tbody tr:last-child { border-bottom: none; }
  .bl-table td { padding: 8px 14px; vertical-align: middle; }

  .bl-td-name { display: flex; align-items: center; gap: 10px; }
  .bl-swatch { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  .bl-cell-input {
    background: transparent;
    border: 1px solid transparent;
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    border-radius: 6px;
    padding: 6px 8px;
  }
  .bl-cell-input:hover { border-color: var(--border); }
  .bl-cell-input:focus { outline: none; border-color: var(--brass); background: var(--surface); }
  .bl-cell-input-name { width: 100%; min-width: 140px; }
  .bl-cell-input-num { width: 60px; font-family: 'IBM Plex Mono', monospace; text-align: right; }
  .bl-cell-input-bottle { width: 60px; }

  .bl-amount-cell { display: flex; align-items: center; gap: 4px; }
  .bl-unit-select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    border-radius: 6px;
    padding: 6px 4px;
  }

  .bl-presentation-cell { display: flex; flex-direction: column; gap: 6px; }
  .bl-mode-toggle {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    width: fit-content;
  }
  .bl-mode-btn {
    background: var(--surface);
    border: none;
    color: var(--muted-dim);
    font-family: 'Inter', sans-serif;
    font-size: 11.5px;
    padding: 5px 9px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .bl-mode-btn + .bl-mode-btn { border-left: 1px solid var(--border); }
  .bl-mode-btn:hover { color: var(--cream); }
  .bl-mode-active { background: rgba(198, 139, 74, 0.16); color: var(--brass-bright); }

  .bl-bottle-size-wrap { display: flex; align-items: center; gap: 5px; }
  .bl-bottle-unit { font-size: 10.5px; color: var(--muted-dim); font-family: 'IBM Plex Mono', monospace; }

  .bl-td-computed { font-family: 'IBM Plex Mono', monospace; color: var(--muted); white-space: nowrap; }
  .bl-td-total { color: var(--brass-bright); font-weight: 500; }
  .bl-td-needed { color: var(--cream); font-weight: 600; }

  .bl-table tfoot td { padding: 12px 14px; border-top: 1px solid var(--border); }
  .bl-tfoot-label { font-family: 'Inter', sans-serif; font-weight: 600; color: var(--cream); font-size: 12.5px; }
  .bl-tfoot-strong { font-family: 'IBM Plex Mono', monospace; color: var(--cream); font-weight: 600; }

  .bl-add-ing-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 14px;
    transition: all 0.15s ease;
  }
  .bl-add-ing-btn:hover { color: var(--brass-bright); border-color: var(--brass); }

  .bl-panel-empty {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted-dim);
    font-size: 13px;
    margin-top: 14px;
  }

  .bl-footer-note {
    padding: 14px 24px;
    text-align: center;
    font-size: 11.5px;
    color: var(--muted-dim);
    border-top: 1px solid var(--border-soft);
    background: var(--bg-elevated);
  }

  /* responsive */
  @media (max-width: 860px) {
    .bl-body { flex-direction: column; }
    .bl-sidebar {
      width: 100%;
      border-right: none;
      border-bottom: 1px solid var(--border-soft);
      display: none;
    }
    .bl-sidebar-open { display: flex; }
    .bl-mobile-toggle { display: block; }
    .bl-main { padding: 20px 16px 34px; }
    .bl-name-input { font-size: 24px; }
    .bl-panel-actions { width: 100%; }
    .bl-ghost-btn { flex: 1; justify-content: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bl-spin { animation: none; }
    * { transition: none !important; }
  }

  /* print / export to PDF */
  @media print {
    .bl-no-print { display: none !important; }
    html, body { background: #fff !important; }
    .bl-root { background: #fff !important; color: #111 !important; }
    .bl-body { display: block; }
    .bl-main { padding: 0; overflow: visible; }
    .bl-print-header { display: block; margin-bottom: 18px; }
    .bl-print-eyebrow {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #666;
      margin: 0 0 4px;
    }
    .bl-print-header h1 { font-family: 'Fraunces', serif; font-size: 26px; margin: 0 0 4px; color: #111; }
    .bl-print-meta { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #444; margin: 0; }
    .bl-panel-head-row { display: none; }
    .bl-target-row { margin-top: 0; }
    .bl-liter-input-wrap { border: none; background: none; }
    .bl-liter-input { color: #111 !important; font-size: 13px; padding: 0; width: auto; }
    .bl-liter-unit { color: #444; }
    .bl-ratio-bar { border-color: #ccc; }
    .bl-ratio-caption { color: #666; }
    .bl-table-wrap { border-color: #ccc; }
    .bl-table thead th { background: #f4f4f4 !important; color: #333 !important; border-color: #ccc !important; }
    .bl-table tbody tr, .bl-table tfoot td { border-color: #ddd !important; }
    .bl-cell-input, .bl-unit-select, .bl-liter-input { color: #111 !important; border-color: transparent !important; background: none !important; }
    .bl-cell-input:hover, .bl-cell-input:focus { border-color: transparent !important; background: none !important; }
    .bl-td-computed { color: #333 !important; }
    .bl-td-total, .bl-td-needed { color: #111 !important; }
    .bl-tfoot-label, .bl-tfoot-strong { color: #111 !important; }
    .bl-mode-btn { color: #111 !important; }
    .bl-mode-toggle { border: none; }
    .bl-mode-btn:not(.bl-mode-active) { display: none; }
    .bl-mode-active { background: none !important; padding: 0 !important; }
    .bl-mode-btn + .bl-mode-btn { border-left: none; }
  }
</style>
</head>

<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

// ---------------------------------------------------------------------------
// Tiny self-contained icon set (feather-style outline icons, no dependency)
// ---------------------------------------------------------------------------
function Icon({ children, size = 16, className = "", style = {} }) {
  return (
    <svg
      width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
      className={className} style={style}
    >
      {children}
    </svg>
  );
}
const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
const Trash2 = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></Icon>;
const Copy = (p) => <Icon {...p}><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></Icon>;
const Printer = (p) => <Icon {...p}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></Icon>;
const Check = (p) => <Icon {...p}><polyline points="20 6 9 17 4 12"/></Icon>;
const Droplets = (p) => <Icon {...p}><path d="M12 2.7l5.7 5.7a8 8 0 1 1-11.4 0z"/></Icon>;
const Martini = (p) => <Icon {...p}><path d="M4 5h16l-7 8.5V19h4"/><path d="M9 19h6"/><path d="M12 13.5V19"/></Icon>;
const FlaskConical = (p) => <Icon {...p}><path d="M9 3h6"/><path d="M10 3v6.2L4.6 18.5A1.8 1.8 0 0 0 6.2 21h11.6a1.8 1.8 0 0 0 1.6-2.5L14 9.2V3"/></Icon>;

// ---------------------------------------------------------------------------
// Design tokens: a bartender's batching spec sheet — precise, tactile,
// low-lit bar at prep time. Palette pulls from bottle glass and copper bar
// tools. Numbers get a mono face (jigger precision); cocktail names get a
// warm display serif; everything else is a plain grotesk.
// ---------------------------------------------------------------------------

const COLORS = [
  "#C68B4A", "#7A9A87", "#A65A73", "#4F8FA6",
  "#B99470", "#8C7BAF", "#C1573D", "#5E7A5B",
];

const STORAGE_KEY = "batch-lab-state";
const DEFAULT_BOTTLE_SIZE = 700;

const uid = () => Math.random().toString(36).slice(2, 10);

const seedCocktails = () => [
  {
    id: uid(), name: "Cosmo del Sur", targetLiters: 10,
    ingredients: [
      { id: uid(), name: "Heredero London Dry", amount: 35, unit: "ml", trackBottles: true, bottleSize: 700 },
      { id: uid(), name: "Bols Frambuesa", amount: 15, unit: "ml", trackBottles: true, bottleSize: 750 },
      { id: uid(), name: "Licor de Cassis", amount: 15, unit: "ml", trackBottles: true, bottleSize: 750 },
      { id: uid(), name: "Almíbar", amount: 15, unit: "ml", trackBottles: false, bottleSize: null },
      { id: uid(), name: "Ácido cítrico", amount: 0.4, unit: "gr", trackBottles: false, bottleSize: null },
      { id: uid(), name: "Ácido ascórbico", amount: 0.2, unit: "gr", trackBottles: false, bottleSize: null },
      { id: uid(), name: "Agua", amount: 22.5, unit: "ml", trackBottles: false, bottleSize: null },
    ],
  },
  {
    id: uid(), name: "Spritz FD", targetLiters: 10,
    ingredients: [
      { id: uid(), name: "Torrontés", amount: 45, unit: "ml", trackBottles: true, bottleSize: 750 },
      { id: uid(), name: "Ramazzotti", amount: 22.5, unit: "ml", trackBottles: true, bottleSize: 700 },
      { id: uid(), name: "Campari", amount: 10, unit: "ml", trackBottles: true, bottleSize: 750 },
      { id: uid(), name: "Almíbar simple", amount: 10, unit: "ml", trackBottles: false, bottleSize: null },
    ],
  },
  {
    id: uid(), name: "Praia", targetLiters: 7,
    ingredients: [
      { id: uid(), name: "Sernova", amount: 15, unit: "ml", trackBottles: true, bottleSize: 700 },
      { id: uid(), name: "Chelo Maracuyá", amount: 45, unit: "ml", trackBottles: false, bottleSize: null },
      { id: uid(), name: "Naranja", amount: 15, unit: "ml", trackBottles: false, bottleSize: null },
      { id: uid(), name: "Agua", amount: 30, unit: "ml", trackBottles: false, bottleSize: null },
      { id: uid(), name: "Ácido cítrico", amount: 0.4, unit: "gr", trackBottles: false, bottleSize: null },
    ],
  },
];

const fmt = (n, digits = 1) => {
  if (!isFinite(n)) return "—";
  return n.toLocaleString("es-AR", { minimumFractionDigits: 0, maximumFractionDigits: digits });
};

const neededDisplay = (ing, total) => {
  if (ing.trackBottles) {
    if (!ing.bottleSize || Number(ing.bottleSize) <= 0) return "—";
    return `${fmt(total / Number(ing.bottleSize))} un.`;
  }
  if (ing.unit === "gr") {
    return total >= 1000 ? `${fmt(total / 1000, 2)} kg` : `${fmt(total)} gr`;
  }
  return total >= 1000 ? `${fmt(total / 1000, 2)} L` : `${fmt(total)} ml`;
};

function loadInitialState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed.cocktails && parsed.cocktails.length) {
        return { cocktails: parsed.cocktails, selectedId: parsed.selectedId || parsed.cocktails[0].id };
      }
    }
  } catch (e) { /* ignore corrupt storage */ }
  const seed = seedCocktails();
  return { cocktails: seed, selectedId: seed[0].id };
}

// ---------------------------------------------------------------------------

function App() {
  const initial = useRef(loadInitialState()).current;
  const [cocktails, setCocktails] = useState(initial.cocktails);
  const [selectedId, setSelectedId] = useState(initial.selectedId);
  const [saveState, setSaveState] = useState("idle");
  const [mobileListOpen, setMobileListOpen] = useState(false);
  const saveTimer = useRef(null);
  const firstLoad = useRef(true);

  useEffect(() => {
    if (firstLoad.current) { firstLoad.current = false; return; }
    setSaveState("saving");
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ cocktails, selectedId }));
        setSaveState("saved");
        setTimeout(() => setSaveState("idle"), 1400);
      } catch (e) {
        setSaveState("idle");
      }
    }, 450);
    return () => clearTimeout(saveTimer.current);
  }, [cocktails, selectedId]);

  const selected = cocktails.find((c) => c.id === selectedId) || null;

  const updateCocktail = useCallback((id, patch) => {
    setCocktails((prev) => prev.map((c) => (c.id === id ? { ...c, ...patch } : c)));
  }, []);

  const updateIngredient = useCallback((cocktailId, ingId, patch) => {
    setCocktails((prev) =>
      prev.map((c) =>
        c.id !== cocktailId ? c : { ...c, ingredients: c.ingredients.map((i) => (i.id === ingId ? { ...i, ...patch } : i)) }
      )
    );
  }, []);

  const addIngredient = (cocktailId) => {
    setCocktails((prev) =>
      prev.map((c) =>
        c.id !== cocktailId ? c : {
          ...c,
          ingredients: [...c.ingredients, { id: uid(), name: "", amount: 0, unit: "ml", trackBottles: true, bottleSize: DEFAULT_BOTTLE_SIZE }],
        }
      )
    );
  };

  const removeIngredient = (cocktailId, ingId) => {
    setCocktails((prev) =>
      prev.map((c) => (c.id !== cocktailId ? c : { ...c, ingredients: c.ingredients.filter((i) => i.id !== ingId) }))
    );
  };

  const addCocktail = () => {
    const fresh = { id: uid(), name: "Nuevo cóctel", targetLiters: 10, ingredients: [] };
    setCocktails((prev) => [...prev, fresh]);
    setSelectedId(fresh.id);
    setMobileListOpen(false);
  };

  const duplicateCocktail = (id) => {
    const original = cocktails.find((c) => c.id === id);
    if (!original) return;
    const clone = {
      ...original, id: uid(), name: `${original.name} (copia)`,
      ingredients: original.ingredients.map((i) => ({ ...i, id: uid() })),
    };
    setCocktails((prev) => {
      const idx = prev.findIndex((c) => c.id === id);
      const next = [...prev];
      next.splice(idx + 1, 0, clone);
      return next;
    });
    setSelectedId(clone.id);
    setMobileListOpen(false);
  };

  const removeCocktail = (id) => {
    const c = cocktails.find((x) => x.id === id);
    if (!window.confirm(`¿Borrar "${c.name}"? Esta acción no se puede deshacer.`)) return;
    setCocktails((prev) => {
      const next = prev.filter((x) => x.id !== id);
      if (selectedId === id) setSelectedId(next.length ? next[0].id : null);
      return next;
    });
  };

  return (
    <div className="bl-root">
      <header className="bl-header bl-no-print">
        <div className="bl-brand">
          <FlaskConical size={20} />
          <span className="bl-brand-name">Batch<em>Lab</em></span>
        </div>
        <div className="bl-header-right">
          <SaveIndicator state={saveState} />
          <button className="bl-mobile-toggle" onClick={() => setMobileListOpen((v) => !v)}>
            {mobileListOpen ? "Cerrar" : "Mis cócteles"}
          </button>
        </div>
      </header>

      <div className="bl-body">
        <aside className={`bl-sidebar bl-no-print ${mobileListOpen ? "bl-sidebar-open" : ""}`}>
          <button className="bl-new-btn" onClick={addCocktail}>
            <Plus size={16} /> Nuevo cóctel
          </button>
          <div className="bl-side-list">
            {cocktails.length === 0 && <p className="bl-side-empty">Todavía no cargaste ningún cóctel.</p>}
            {cocktails.map((c) => (
              <SidebarItem
                key={c.id} cocktail={c} active={c.id === selectedId}
                onSelect={() => { setSelectedId(c.id); setMobileListOpen(false); }}
                onDuplicate={() => duplicateCocktail(c.id)}
                onDelete={() => removeCocktail(c.id)}
              />
            ))}
          </div>
        </aside>

        <main className="bl-main">
          {!selected ? (
            <EmptyState onAdd={addCocktail} />
          ) : (
            <CocktailPanel
              cocktail={selected}
              onUpdateCocktail={(patch) => updateCocktail(selected.id, patch)}
              onUpdateIngredient={(ingId, patch) => updateIngredient(selected.id, ingId, patch)}
              onAddIngredient={() => addIngredient(selected.id)}
              onRemoveIngredient={(ingId) => removeIngredient(selected.id, ingId)}
              onDuplicate={() => duplicateCocktail(selected.id)}
            />
          )}
        </main>
      </div>

      <footer className="bl-footer-note bl-no-print">Los datos se guardan en este navegador.</footer>
    </div>
  );
}

function SaveIndicator({ state }) {
  if (state === "idle") return <span className="bl-save bl-save-idle" />;
  if (state === "saving") return <span className="bl-save bl-save-saving"><span className="bl-spinner bl-spin" /> Guardando</span>;
  return <span className="bl-save bl-save-saved"><Check size={13} /> Guardado</span>;
}

function SidebarItem({ cocktail, active, onSelect, onDuplicate, onDelete }) {
  const sum = cocktail.ingredients.reduce((s, i) => s + (Number(i.amount) || 0), 0);
  return (
    <div className={`bl-side-item ${active ? "bl-side-item-active" : ""}`} onClick={onSelect}>
      <div className="bl-side-item-top">
        <span className="bl-side-item-name">{cocktail.name || "Sin nombre"}</span>
        <div className="bl-side-item-actions">
          <button className="bl-icon-btn bl-icon-btn-ghost" onClick={(e) => { e.stopPropagation(); onDuplicate(); }} title="Duplicar">
            <Copy size={13} />
          </button>
          <button className="bl-icon-btn bl-icon-btn-ghost" onClick={(e) => { e.stopPropagation(); onDelete(); }} title="Borrar">
            <Trash2 size={13} />
          </button>
        </div>
      </div>
      <div className="bl-side-item-meta">
        {cocktail.ingredients.length} insumo{cocktail.ingredients.length !== 1 ? "s" : ""} · {fmt(cocktail.targetLiters)} L
      </div>
      {sum > 0 && (
        <div className="bl-mini-bar">
          {cocktail.ingredients.map((i, idx) => (
            <span key={i.id} style={{ width: `${((Number(i.amount) || 0) / sum) * 100}%`, background: COLORS[idx % COLORS.length] }} />
          ))}
        </div>
      )}
    </div>
  );
}

function EmptyState({ onAdd }) {
  return (
    <div className="bl-empty">
      <Martini size={30} />
      <h2>Armá tu primera receta</h2>
      <p>Cargá los insumos de un cóctel con su cantidad por trago y la app va a calcular el lote completo cuando le digas cuántos litros necesitás.</p>
      <button className="bl-new-btn" onClick={onAdd}><Plus size={16} /> Nuevo cóctel</button>
    </div>
  );
}

const LITER_PRESETS = [5, 7, 10, 15, 20];

function CocktailPanel({ cocktail, onUpdateCocktail, onUpdateIngredient, onAddIngredient, onRemoveIngredient, onDuplicate }) {
  const ingredients = cocktail.ingredients;
  const sumUnit = ingredients.reduce((s, i) => s + (Number(i.amount) || 0), 0);
  const scale = sumUnit > 0 ? 1000 / sumUnit : 0;
  const target = Number(cocktail.targetLiters) || 0;

  const handlePrint = () => window.print();

  const toggleBottles = (ing, trackBottles) => {
    if (trackBottles && !ing.bottleSize) onUpdateIngredient(ing.id, { trackBottles, bottleSize: DEFAULT_BOTTLE_SIZE });
    else onUpdateIngredient(ing.id, { trackBottles });
  };

  return (
    <div className="bl-panel">
      <div className="bl-print-header">
        <p className="bl-print-eyebrow">Especificación de producción</p>
        <h1>{cocktail.name}</h1>
        <p className="bl-print-meta">Lote: {fmt(target)} L &middot; {new Date().toLocaleDateString("es-AR")}</p>
      </div>

      <div className="bl-panel-head">
        <div className="bl-panel-head-row">
          <input className="bl-name-input" value={cocktail.name} onChange={(e) => onUpdateCocktail({ name: e.target.value })} placeholder="Nombre del cóctel" />
          <div className="bl-panel-actions bl-no-print">
            <button className="bl-ghost-btn" onClick={onDuplicate}><Copy size={14} /> Duplicar</button>
            <button className="bl-ghost-btn" onClick={handlePrint}><Printer size={14} /> Imprimir / PDF</button>
          </div>
        </div>

        <div className="bl-target-row">
          <label className="bl-field">
            <span className="bl-field-label">Litros a producir</span>
            <div className="bl-liter-input-wrap">
              <input type="number" min="0" step="0.5" className="bl-liter-input" value={cocktail.targetLiters} onChange={(e) => onUpdateCocktail({ targetLiters: e.target.value })} />
              <span className="bl-liter-unit">L</span>
            </div>
          </label>
          <div className="bl-presets bl-no-print">
            {LITER_PRESETS.map((n) => (
              <button key={n} className={`bl-preset ${Number(cocktail.targetLiters) === n ? "bl-preset-active" : ""}`} onClick={() => onUpdateCocktail({ targetLiters: n })}>{n}L</button>
            ))}
          </div>
        </div>
      </div>

      {ingredients.length > 0 && (
        <div className="bl-ratio-section">
          <div className="bl-ratio-bar">
            {ingredients.map((i, idx) => {
              const pct = sumUnit > 0 ? ((Number(i.amount) || 0) / sumUnit) * 100 : 0;
              if (pct <= 0) return null;
              return <div key={i.id} className="bl-ratio-seg" style={{ width: `${pct}%`, background: COLORS[idx % COLORS.length] }} title={`${i.name || "Insumo"} — ${fmt(pct)}%`} />;
            })}
          </div>
          <div className="bl-ratio-caption">Proporción de la receta &middot; base 1 L</div>
        </div>
      )}

      <div className="bl-table-wrap">
        <table className="bl-table">
          <thead>
            <tr>
              <th className="bl-th-name">Insumo</th>
              <th>Por trago</th>
              <th>Presentación</th>
              <th>Por litro</th>
              <th>Total ({fmt(target)} L)</th>
              <th>Necesario</th>
              <th className="bl-no-print" />
            </tr>
          </thead>
          <tbody>
            {ingredients.map((ing, idx) => {
              const amount = Number(ing.amount) || 0;
              const perLiter = amount * scale;
              const total = perLiter * target;
              return (
                <tr key={ing.id}>
                  <td className="bl-td-name">
                    <span className="bl-swatch" style={{ background: COLORS[idx % COLORS.length] }} />
                    <input className="bl-cell-input bl-cell-input-name" value={ing.name} placeholder="Nombre del insumo" onChange={(e) => onUpdateIngredient(ing.id, { name: e.target.value })} />
                  </td>
                  <td>
                    <div className="bl-amount-cell">
                      <input type="number" step="0.1" min="0" className="bl-cell-input bl-cell-input-num" value={ing.amount} onChange={(e) => onUpdateIngredient(ing.id, { amount: e.target.value })} />
                      <select className="bl-unit-select" value={ing.unit} onChange={(e) => onUpdateIngredient(ing.id, { unit: e.target.value })}>
                        <option value="ml">ml</option>
                        <option value="gr">gr</option>
                      </select>
                    </div>
                  </td>
                  <td>
                    <div className="bl-presentation-cell">
                      <div className="bl-mode-toggle">
                        <button className={`bl-mode-btn ${ing.trackBottles ? "bl-mode-active" : ""}`} onClick={() => toggleBottles(ing, true)}>Botella</button>
                        <button className={`bl-mode-btn ${!ing.trackBottles ? "bl-mode-active" : ""}`} onClick={() => toggleBottles(ing, false)}>Granel</button>
                      </div>
                      {ing.trackBottles && (
                        <div className="bl-bottle-size-wrap">
                          <input type="number" min="1" className="bl-cell-input bl-cell-input-num bl-cell-input-bottle" value={ing.bottleSize ?? ""} onChange={(e) => onUpdateIngredient(ing.id, { bottleSize: e.target.value === "" ? null : e.target.value })} />
                          <span className="bl-bottle-unit">ml/bot</span>
                        </div>
                      )}
                    </div>
                  </td>
                  <td className="bl-td-computed">{fmt(perLiter)} {ing.unit}</td>
                  <td className="bl-td-computed bl-td-total">{fmt(total)} {ing.unit}</td>
                  <td className="bl-td-computed bl-td-needed">{neededDisplay(ing, total)}</td>
                  <td className="bl-no-print">
                    <button className="bl-icon-btn bl-icon-btn-ghost" onClick={() => onRemoveIngredient(ing.id)} aria-label="Quitar insumo">
                      <Trash2 size={14} />
                    </button>
                  </td>
                </tr>
              );
            })}
          </tbody>
          {ingredients.length > 0 && (
            <tfoot>
              <tr>
                <td className="bl-td-name bl-tfoot-label">Total por trago</td>
                <td className="bl-td-computed bl-tfoot-strong">{fmt(sumUnit)} ml/gr</td>
                <td />
                <td className="bl-td-computed">{fmt(sumUnit * scale)} ml</td>
                <td className="bl-td-computed bl-tfoot-strong">{fmt(sumUnit * scale * target)} ml</td>
                <td />
                <td className="bl-no-print" />
              </tr>
            </tfoot>
          )}
        </table>
      </div>

      <button className="bl-add-ing-btn bl-no-print" onClick={onAddIngredient}><Plus size={15} /> Agregar insumo</button>

      {ingredients.length === 0 && (
        <p className="bl-panel-empty"><Droplets size={16} /> Este cóctel todavía no tiene insumos. Agregá el primero para empezar a calcular.</p>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
